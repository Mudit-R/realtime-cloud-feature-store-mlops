services:
  - type: web
    name: realtime-feature-store-mlops
    runtime: python
    buildCommand: pip install -r requirements.txt && pip install -e . && python scripts/run_pipeline.py
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port 
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
